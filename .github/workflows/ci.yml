name: CI

on:
  pull_request:
  # Also on main, so a merge that goes green in isolation but red in
  # combination is caught rather than discovered by the next pull request.
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest

    # Tests run against a real Postgres, never a fake. This is the same
    # contract as local development; only the connection string differs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Set in the environment so it wins over the local default in .env.test.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobfinder_test

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest

    env:
      # A placeholder, not a credential: better-auth refuses to start without a
      # secret, and a build that fell back to its default would log an error
      # here and hide a real misconfiguration in production. The real one is
      # set in Vercel (#20) and never lives in this repository.
      BETTER_AUTH_SECRET: build-time-placeholder-not-used-to-sign-anything

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  migrate:
    name: migrate production
    runs-on: ubuntu-latest

    # Only a merge to main migrates. `pull_request` and every preview build are
    # left alone — which is the objection the provisioning wizard raised
    # against migrating from inside the build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Never migrate a checkout that does not typecheck, lint, test, and build.
    needs: [typecheck, lint, test, build]

    # One migration at a time, and never cancelled partway through — this
    # overrides the workflow-level `cancel-in-progress: true`, which must not
    # apply to a job that writes to the production database.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    # Scopes `PROD_DATABASE_URL` to this job and lets a human add required
    # reviewers on the GitHub environment if they want a gate before it runs.
    environment: production

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # drizzle-kit records each migration it applies, so a run with nothing
      # new to do is a no-op rather than an error.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
